<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>index</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  </head>
  <body>
    <%- include('./layout/header'); -%>

    <div class="profile-about-me">
      <div class="container">
          <main class="main col-10 mx-auto">
            <ul class="nav justify-content-center mb-4">
              <li class="nav-item border rounded-3 d-flex align-items-center mx-2">
                <span class="d-inline-block material-symbols-outlined">face</span>
                <a class="nav-link active ms-1  p-0" aria-current="page" href="profile.html">個人資料</a>
              </li>
              <li class="nav-item border rounded-3 d-flex align-items-center mx-2">
                <span class="d-inline-block material-symbols-outlined">pending_actions</span>
                <a class="nav-link ms-1 p-0" href="schedule.html">預約資料</a>
              </li>
              <li class="nav-item border rounded-3 d-flex align-items-center mx-2">
                <span class="d-inline-block material-symbols-outlined">list_alt</span>
                <a class="nav-link ms-1 p-0" href="plans.html">職旅計畫</a>
              </li>
            </ul>
            <div class="d-flex justify-content-between p-5 shadow-lg p-3 mb-5 bg-body rounded">
              <span class="inf col-lg-2 d-block tw-medium-2xl">個人資料</span>
              <div class="form col-lg-8">
                <div class="user-photo d-flex mb-4 align-items-end">
                  <img class="rounded-circle" src="../assets/images/avatar.png" alt="">
                  <button  type="button" class="btn btn-light ms-3 d-flex border py-2">
                    <span class="material-symbols-outlined">upload</span>
                    <span class="ms-1">更新頭貼</span>
                  </button>
                </div>    
                <form class="form-floating mb-4">
                  <input type="email" class="form-control always-float" id="floatingInputValue" placeholder="name@example.com" value="">
                  <label for="floatingInputValue">姓名</label>
                </form>
                <div class="gender-check mb-3">
                  <span class="d-block mb-1 tw-regular-md">性別</span>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                    <label class="form-check-label" for="inlineRadio1">女性</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                    <label class="form-check-label" for="inlineRadio2">男性</label>
                  </div>
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                    <label class="form-check-label" for="inlineRadio2">不願透漏</label>
                  </div>
                </div>
                <form class="form-floating mb-4">
                  <input type="date" class="form-control always-float" id="floatingInputValue" placeholder="" value="">
                  <label for="floatingInputValue">生日</label>
                </form>
                <div class="password mb-4">
                  <span class="tw-regular-md d-block mb-2">密碼</span>
                  <button type="button" class="btn btn-primary d-flex" data-bs-toggle="modal" data-bs-target="#exampleModal" data-bs-whatever="@mdo">
                    修改密碼
                    <span class="material-symbols-outlined">chevron_right</span>
                  </button>
                  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                    <div class="modal-dialog">
                      <div class="modal-content">
                        <div class="modal-header">
                          <h5 class="modal-title" id="exampleModalLabel">更新密碼</h5>
                          <span class="material-symbols-outlined">chevron_right</span>
                        </div>
                        <div class="modal-body">
                          <form>
                            <div class="mb-3">
                              <label for="inputPassword2" class="visually-hidden">Password</label>
                              <input type="password" class="form-control" id="inputPassword2" placeholder="新密碼">
                            </div>
                            <div class="mb-3">
                              <label for="inputPassword2" class="visually-hidden">Password</label>
                              <input type="password" class="form-control" id="inputPassword2" placeholder="再次密碼">
                            </div>
                          </form>
                        </div>
                        <div class="modal-footer">
                          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">更新密碼</button>                          
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="email mb-4">
                  <form class="form-floating mb-4">
                    <input type="email" class="form-control always-float" id="floatingInputValue" placeholder="name@example.com" value="">
                    <label for="floatingInputValue">信箱</label>
                    <span class="tw-regular-md tw-regular-md text-secondary ps-2">盡量勿使用Yahoo或Hotmail郵件信箱，以免因擋信、漏信</span>
                  </form>
                </div>
                <div class="phone mb-4">
                  <form class="form-floating mb-4">
                    <input type="text" class="form-control always-float" id="phone" placeholder="" value="">
                    <label for="phone">連絡電話</label>
                  </form>
                </div>
                <div class="adress mb-4">
                  <form class="form-floating mb-4">
                    <input type="text" class="form-control always-float" id="adress" placeholder="" value="">
                    <label for="adress">地址</label>                    
                  </form>
                </div>
                <div class="chick-btn d-flex justify-content-center">
                  <button  type="button" class="btn me-4 btn-light d-flex border py-2 px-4">
                    <span class="me-1">重新填寫</span>
                    <span class="material-symbols-outlined">chevron_right</span>
                  </button>
                  <button  type="button" class="btn btn-light d-flex border py-2 px-4 bg-dark text-white px-2 px-4">
                        <span class="me-1">儲存更新</span>
                        <span class="material-symbols-outlined">chevron_right</span>
                  </button>
                </div>
              </div>
            </div>
          </main>
      </div>
    </div>

    <%- include('./layout/footer'); -%>
    <script type="module" src="../main.js"></script>
  </body>
</html>
